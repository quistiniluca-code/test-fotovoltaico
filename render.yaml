services:
  - type: web
    name: econ-fv-bill-parser
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./parser-service/Dockerfile
    dockerContext: ./parser-service
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ECON_PARSER_SHARED_SECRET
        sync: false
      - key: ECON_MAX_UPLOAD_MB
        value: "18"
      - key: ECON_ALLOWED_ORIGINS
        value: https://test-fotovoltaico.netlify.app
      - key: ECON_ALLOWED_ORIGIN_REGEX
        value: ""
      - key: ECON_ALLOW_UNSIGNED_DEV
        value: "false"
