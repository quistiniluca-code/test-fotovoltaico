name: ECON V1.8 quality gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  netlify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
