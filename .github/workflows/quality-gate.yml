name: ECON V1.7 quality gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  netlify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
