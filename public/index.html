<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECON — Test Fotovoltaico</title><style>:root{--d:#043D00;--l:#8DC63F;--s:#F3FAEC;--b:#DDE8D8}*{box-sizing:border-box}body{margin:0;background:var(--s);font:16px Arimo,Arial,sans-serif;color:#0F230D}.app{min-height:100svh;display:grid;place-items:center;padding:14px}.p{width:min(620px,100%);min-height:min(900px,calc(100svh - 28px));background:#fff;border-radius:28px;box-shadow:0 24px 70px #043d001c;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 10px}.back{border:0;background:var(--s);color:var(--d);width:40px;height:40px;border-radius:50%;font-size:22px;visibility:hidden}.brand{font-weight:700;letter-spacing:.12em;color:var(--d)}.bar{height:4px;background:#e6eee2;margin:0 24px}.bar i{display:block;height:100%;background:var(--l)}#v{padding:26px 24px 28px;display:flex;flex:1;flex-direction:column}.k{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--d);text-transform:uppercase;margin-bottom:14px}h1,h2{margin:0;color:var(--d);line-height:1;letter-spacing:-.03em}h1{font-size:clamp(38px,9vw,52px)}h2{font-size:clamp(28px,7vw,36px)}.a{color:var(--l)}p{line-height:1.48;color:#31452e}.opts{display:grid;gap:9px;margin-top:18px}.o,.btn,.pill{cursor:pointer;font:inherit}.o{border:1px solid var(--b);background:#fff;border-radius:16px;padding:14px;text-align:left}.o.sel{border-color:var(--d);background:var(--s);box-shadow:inset 4px 0 var(--l)}.pill{display:none;margin-top:14px;border:0;border-radius:999px;background:var(--d);color:#fff;padding:14px 16px;font-weight:700;text-align:left}.pill.on{display:block}.actions{margin-top:auto;padding-top:22px}.btn{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--d);color:#fff;font-weight:700;padding:10px 18px}.alt{background:#fff;color:var(--d);border:1px solid var(--b);margin-top:8px}.f{width:100%;padding:14px;border:1px solid #bfd1b7;border-radius:16px;margin:5px 0;font:inherit}.card{border:1px solid var(--b);background:var(--s);border-radius:18px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--b);font-size:13px}.row span{color:#5D6E58}.row b{text-align:right;color:var(--d)}.metric{background:var(--d);color:#fff;border-radius:20px;padding:18px;margin:12px 0}.metric b{display:block;font-size:42px;color:var(--l)}.score{font-size:68px;font-weight:700;color:var(--l)}.small{font-size:11px;color:#5D6E58;line-height:1.4}.upload{border:2px dashed #bfd1b7;border-radius:18px;padding:28px;text-align:center;background:var(--s)}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:8px;margin-top:10px;font-size:13px}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><main class="p"><div class="top"><button id="b" class="back">←</button><div class="brand">ECON</div><small id="m"></small></div><div class="bar"><i id="bar"></i></div><section id="v"></section></main></div><script>
const s={i:0,h:[],a:{},bill:null,score:0,cfg:null,id:crypto.randomUUID()},$=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=[['attitude','PRIMA DELLA SFIDA','Sul fotovoltaico, da che parte stai?',['Molto favorevole','Favorevole, ma solo se i numeri tornano','Interessato, ma non ancora convinto','Scettico','Molto scettico']],['property','SFIDA 1/5 · CASA','Dove potrebbe nascere il tuo fotovoltaico?',['Casa indipendente','Villetta / bifamiliare','Condominio','Altro','Non lo so ancora']],['roof_control','SFIDA 1/5 · CASA','Quanto controllo hai sulla decisione del tetto?',['Posso decidere io','Decidiamo in più persone','Dipende dal condominio','Non lo so ancora']],['roof_type','SFIDA 1/5 · CASA','Che forma ha il tetto?',['Una o due falde principali','Più falde','Tetto piano','Non lo so']],['usage','SFIDA 2/5 · ENERGIA','Quando consumi maggiormente?',['Soprattutto di giorno','Soprattutto la sera','Giorno e sera','Non lo so']],['current_loads','SFIDA 2/5 · ENERGIA','Quali consumi importanti hai già elettrificato?',['Climatizzazione','Pompa di calore','Auto elettrica / plug-in','Piano a induzione','Nessuno di questi','Non lo so']],['future_loads','SFIDA 3/5 · DOMANI','Nei prossimi 3 anni, cosa potrebbe cambiare?',['Auto elettrica / plug-in','Pompa di calore','Più climatizzazione','Altri nuovi consumi','Probabilmente nulla','Non lo so ancora']],['goal','SFIDA 4/5 · OBIETTIVO','Cosa vorresti ottenere davvero?',['Prelevare meno energia dalla rete','Aumentare la mia autonomia energetica','Essere più indipendente dalla rete','Preparare casa ai consumi futuri','Ricaricare l’auto con la mia energia','Capire se vale la pena approfondire']],['uncertainty','SFIDA 4/5 · DUBBIO','Cosa vuoi chiarire prima di decidere?',['Se economicamente ne vale la pena','Se il tetto è adatto','Se mi serve una batteria','La dimensione corretta','Se un preventivo è sensato','Altro']],['identity','PROFILO DECISIONALE · 1/3','Che tipo di scelta vorresti che fosse?',['Essere un passo avanti','Aver deciso con criterio','Avere più controllo','Aver valorizzato casa mia']],['style','PROFILO DECISIONALE · 2/3','Quando fai una scelta importante, cosa ti distingue?',['Voglio capire meglio degli altri','Non mi basta una soluzione standard','Decido quando i numeri mi convincono','Mi fido del mio giudizio']],['reward','PROFILO DECISIONALE · 3/3','Quale risultato ti darebbe più soddisfazione?',['Aver colto il momento giusto','Sapere di aver scelto bene','Sentirmi più libero nella gestione dell’energia','Vedere casa più evoluta e valorizzata']],['system','SFIDA 5/5 · LA TUA IDEA','Quale fotovoltaico immagineresti per casa tua?',['Solo fotovoltaico','Fotovoltaico + accumulo','Fotovoltaico + accumulo con backup','Fotovoltaico + ricarica auto','Fotovoltaico + accumulo + ricarica','Non lo so ancora']]];
function t(e,d={}){fetch('/api/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:s.id,event:e,step:s.i,detail:d}),keepalive:true}).catch(()=>{})}function go(n){if(n>s.i)s.h.push(s.i);s.i=n;r();t('screen_view')}function back(){if(s.h.length){s.i=s.h.pop();r()}}$('b').onclick=back;function sh(k,h,p,b){return `<div class=k>${k}</div><h2>${h}</h2>${p?`<p>${p}</p>`:''}${b}`}
function q(x){let z=Q[x],v=s.a[z[0]];return sh(z[1],z[2].replace('fotovoltaico','<span class=a>fotovoltaico</span>'),'Scegli la risposta che ti rappresenta di più.',`<div class=opts>${z[3].map((o,i)=>`<button class="o ${v===i?'sel':''}" data-n=${i}>${o}</button>`).join('')}</div><button class="pill ${v!==undefined?'on':''}" id=pill>Approfondimento registrato → continua</button>`)}
function val(k){return s.bill?.fields?.[k]?.value??s.bill?.[k]??''}function src(k){return s.bill?.fields?.[k]?.source||''}
function score(){let n=0;if(s.a.property!==4)n+=5;if(s.a.roof_control!==3)n+=5;if(s.a.roof_type!==3)n+=5;if(s.bill)n+=5;if(+val('annual_kwh'))n+=15;if(+val('coverage_months')>=11)n+=10;else if(+val('coverage_months')>=6)n+=5;if(val('f1_kwh')||val('f2_kwh')||val('f3_kwh'))n+=5;if(s.a.usage!==3)n+=6;if(s.a.current_loads!==5)n+=6;if(s.a.future_loads!==5)n+=8;if(s.a.goal!==undefined)n+=8;if(s.a.uncertainty!==undefined)n+=6;return n}function eco(){let k=+val('annual_kwh')||0,sp=+val('annual_spend')||0;if(!k)return null;let c=sp/k||.31,pv=Math.min(12,Math.max(3,k/1250*1.05)),prod=pv*1250,au=s.a.usage===0?.58:s.a.usage===1?.38:.48,self=Math.min(k,prod*au),sav=self*c*.74+Math.max(0,prod-self)*.06,inv=Math.max(5000,pv*1350);return{sav,y:sav/inv*100,p:inv/sav,k,sp,prod,inv}}
function confirm(){let f=[['annual_kwh','Consumo annuo','kWh'],['annual_spend','Spesa di riferimento','€'],['period_kwh','Consumo fattura','kWh'],['bill_amount','Importo fattura','€'],['pod','POD',''],['power_kw','Potenza','kW'],['supply_address','Indirizzo','']];return sh('VERIFICA DATI','Abbiamo letto questi dati dalla tua bolletta.','Confermali prima della diagnosi.',`<div class=card>${f.map(x=>`<div class=row><span>${x[1]}</span><b>${E(val(x[0])||'Non rilevato')} ${x[2]}<small>${E(src(x[0]))}</small></b></div>`).join('')}</div><div class=actions><button class=btn id=okbill>Conferma questi dati</button></div>`)}function diag(){let e=eco();if(!e)return sh('MINI DIAGNOSI','Manca il consumo annuo.','Serve un dato confermato per costruire lo scenario.','');return sh('MINI DIAGNOSI','La bolletta apre uno scenario <span class=a>interessante</span>.','Dato reale e simulazione restano separati.',`<div class=card><div class=row><span>Consumo letto</span><b>${Math.round(e.k).toLocaleString('it-IT')} kWh/anno</b></div><div class=row><span>Spesa</span><b>${e.sp?Math.round(e.sp).toLocaleString('it-IT')+' €':'Non rilevata'}</b></div></div><div class=metric><small>SCENARIO IDEALE · SIMULAZIONE</small><b>fino a ${Math.round(e.sav).toLocaleString('it-IT')} €</b><span>/ anno</span></div><div class=grid><div class=card><b>${e.y.toFixed(1)}%</b><div class=small>rendimento semplice / anno</div></div><div class=card><b>${e.p.toFixed(1)} anni</b><div class=small>rientro semplice</div></div></div><div class=small>Scenario favorevole preliminare: produzione ${Math.round(e.prod)} kWh/anno, investimento assunto ${Math.round(e.inv)} €. Non è un’offerta.</div><div class=actions><button class=btn id=dn>Continua</button></div>`)}
function render(){let h='';$('b').style.visibility=s.h.length?'visible':'hidden';$('bar').style.width=Math.min(100,s.i/23*100)+'%';$('m').textContent=s.i?`${Math.min(s.i,23)}/23`:'';if(s.i===0)h=`<div class=k>TEST FOTOVOLTAICO ECON</div><h1>Quanto sei pronto per il <span class=a>fotovoltaico</span>?</h1><p>5 sfide. 100 punti. + una <span class=a>sorpresa</span> da sbloccare.</p><div class=actions><button class=btn id=start>Verifica la tua energia</button></div>`;else if(s.i>=1&&s.i<=4)h=q(s.i-1);else if(s.i===5)h=sh('SFIDA 2/5 · ENERGIA','Senza guardare la bolletta: quanto pensi di <span class=a>consumare</span>?','Scrivi la tua stima annuale.',`<input id=kwh class=f type=number placeholder="kWh/anno"><div class=actions><button class=btn id=pk>Blocca la stima</button><button class="btn alt" id=nk>Non ne ho idea</button></div>`);else if(s.i>=6&&s.i<=14)h=q(s.i-2);else if(s.i===15)h=sh('SFIDA 5/5 · QUANTO CI CREDI?','Quanto sei sicuro della tua scelta?','',`<div class=score id=confv>${s.a.conf??60}%</div><input id=conf type=range min=0 max=100 value="${s.a.conf??60}" style="width:100%"><div class=actions><button class=btn id=lock>Blocca la mia previsione</button></div>`);else if(s.i===16)h=sh('PREVISIONE BLOCCATA','Questo è quello che pensi prima dei dati.','Ora entra un dato reale.',`<div class=card><div class=row><span>Consumo immaginato</span><b>${s.a.pred?E(s.a.pred)+' kWh/anno':'Non indicato'}</b></div><div class=row><span>Sicurezza</span><b>${s.a.conf??60}%</b></div></div><div class=actions><button class=btn id=ch>Mettila alla prova</button></div>`);else if(s.i===17)h=sh('SFIDA FINALE · ORA ENTRANO I DATI','Ora vediamo cosa dice la <span class=a>bolletta</span>.','PDF o foto leggibile.',`<label class=upload for=file><b>Carica la bolletta</b></label><input id=file class=hide type=file accept="application/pdf,image/*"><div id=up class=small></div>`);else if(s.i===18)h=confirm();else if(s.i===19)h=diag();else if(s.i===20){let real=+val('annual_kwh')||0,p=+s.a.pred||0,d=p?Math.round(Math.abs(p-real)/real*100):null;h=sh('PRIMO CONFRONTO','Quanto eri vicino al dato reale?','La differenza cambia il punto di partenza.',`<div class=card>${p?`<div class=row><span>Hai stimato</span><b>${p} kWh</b></div>`:''}<div class=row><span>La bolletta indica</span><b>${real} kWh</b></div>${d!==null?`<div class=row><span>Scarto</span><b>${d}%</b></div>`:''}</div><div class=actions><button class=btn id=en>Rivela il mio Punteggio FV</button></div>`)}else if(s.i===21){s.score=score();h=sh('IL TUO PUNTEGGIO FV','Il tuo caso è definito per una valutazione preliminare.','Non misura automaticamente convenienza o fattibilità.',`<div class=score>${s.score}<small>/100</small></div><div class=card>${100-s.score} punti ancora da definire.</div><div class=actions><button class=btn id=sn>Collega il mio immobile</button></div>`)}else if(s.i===22)h=sh('COLLEGA IL TUO IMMOBILE','Dove potrebbe nascere il tuo fotovoltaico?','',`<input id=addr class=f placeholder="Via/Piazza e numero civico" value="${E(s.a.addr||val('supply_address')||'')}"><input id=city class=f placeholder="Comune"><input id=cap class=f placeholder="CAP"><div class=actions><button class=btn id=an>Conferma questo immobile</button></div>`);else if(s.i===23)h=sh('SALVA IL TUO RISULTATO','Associa il risultato a te.','Salva il Punteggio FV e sblocca la sorpresa ECON.',`<div class=grid><input id=fn class=f placeholder="Nome"><input id=ln class=f placeholder="Cognome"></div><input id=mob class=f placeholder="Cellulare"><input id=email class=f placeholder="Email"><label class=check><input id=privacy type=checkbox> Ho preso visione dell’informativa privacy.</label><label class=check><input id=com type=checkbox> Sono interessato ad approfondire il mio caso fotovoltaico con ECON.</label><div class=actions><button class=btn id=save>Salva e scopri la sorpresa</button><div id=ls class=small></div></div>`);else h=sh('SORPRESA ECON SBLOCCATA','Questa è la tua <span class=a>sorpresa</span>.','',`<div class=metric><small>SERVIZIO ECON SBLOCCATO</small><b style="font-size:28px">${(s.a.goal===4||s.a.current_loads===2)?'Check Ricarica':(s.a.goal===1||s.a.goal===2)?'Check Sistema Energia':'Check Fotovoltaico dell’immobile'}</b></div><div class=card><div class=row><span>Punteggio</span><b>${s.score}/100</b></div><div class=row><span>Immobile</span><b>${E(s.a.addr||'')}</b></div><div class=row><span>Contatto commerciale</span><b>${s.a.com?'Richiesto':'Non richiesto'}</b></div></div><p><b>Numeri prima delle promesse.</b></p>`);$('v').innerHTML=h;bind()}
async function upload(f){$('up').textContent='Lettura in corso…';t('bill_upload_started');try{let c=s.cfg||await fetch('/api/config').then(x=>x.json());s.cfg=c;if(!c.parser_api_url)throw Error('Parser non configurato');let x=await fetch('/api/parser/ticket',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:s.id})});let tj=await x.json();if(!x.ok)throw Error(tj.detail);let fd=new FormData();fd.append('file',f);fd.append('session_id',s.id);let r=await fetch(c.parser_api_url,{method:'POST',headers:{authorization:`Bearer ${tj.ticket}`},body:fd});let j=await r.json();if(!r.ok)throw Error(j.detail||'lettura fallita');s.bill=j;t('bill_parse_success',{supplier:j.supplier||null});go(18)}catch(e){$('up').textContent='Lettura non riuscita: '+e.message;t('bill_parse_failed',{reason:e.message})}}
function bind(){if(s.i===0)$('start').onclick=()=>go(1);if((s.i>=1&&s.i<=4)||(s.i>=6&&s.i<=14)){let z=s.i<=4?Q[s.i-1]:Q[s.i-2],k=z[0];document.querySelectorAll('.o').forEach(o=>o.onclick=()=>{s.a[k]=+o.dataset.n;render()});if($('pill'))$('pill').onclick=()=>go(s.i+1)}if(s.i===5){$('pk').onclick=()=>{s.a.pred=+$('kwh').value||null;go(6)};$('nk').onclick=()=>{s.a.pred=null;go(6)}}if(s.i===15){$('conf').oninput=e=>{s.a.conf=+e.target.value;$('confv').textContent=s.a.conf+'%'};$('lock').onclick=()=>go(16)}if(s.i===16)$('ch').onclick=()=>go(17);if(s.i===17)$('file').onchange=e=>e.target.files[0]&&upload(e.target.files[0]);if(s.i===18)$('okbill').onclick=()=>{t('bill_data_confirmed');go(19)};if(s.i===19)$('dn').onclick=()=>go(20);if(s.i===20)$('en').onclick=()=>go(21);if(s.i===21)$('sn').onclick=()=>go(22);if(s.i===22)$('an').onclick=()=>{s.a.addr=$('addr').value.trim();s.a.city=$('city').value.trim();s.a.cap=$('cap').value.trim();if(s.a.addr.length<5)return alert('Inserisci l’indirizzo');t('address_confirmed');go(23)};if(s.i===23)$('save').onclick=async()=>{let p={schema:'econ.lead.v1',session_id:s.id,contact:{first_name:$('fn').value.trim(),last_name:$('ln').value.trim(),mobile:$('mob').value.trim(),email:$('email').value.trim(),commercial_fv_request:$('com').checked},property:{address:[s.a.addr,s.a.cap,s.a.city].filter(Boolean).join(', ')},privacy:{acknowledged:$('privacy').checked,version:s.cfg?.privacy_version||'v1.6'},test:{score:s.score,answers:s.a},bill_summary:{annual_kwh:val('annual_kwh'),annual_spend:val('annual_spend'),supplier:s.bill?.supplier||null}};try{let r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}),j=await r.json();if(!r.ok)throw Error(j.detail);s.a.com=$('com').checked;t('lead_completed',{commercial_fv_request:s.a.com});go(24)}catch(e){$('ls').textContent='Errore: '+e.message}}}fetch('/api/config').then(r=>r.ok?r.json():null).then(x=>s.cfg=x).catch(()=>{});render();t('screen_view');
</script></body></html>
