:root{--d:#043D00;--l:#8DC63F;--w:#fff;--soft:#F3FAEC;--line:#DDE8D8;--text:#0F230D;--muted:#5D6E58;--err:#B2442D;--r:20px}*{box-sizing:border-box}html{background:var(--soft)}body{margin:0;color:var(--text);background:var(--soft);font-family:Arimo,Arial,sans-serif}.app{min-height:100svh;display:grid;place-items:center;padding:12px}.shell{width:min(680px,100%);min-height:min(930px,calc(100svh - 24px));background:var(--w);border-radius:28px;box-shadow:0 24px 70px #043d001c;display:flex;flex-direction:column;overflow:hidden}.top{display:grid;grid-template-columns:44px 1fr 62px;align-items:center;gap:10px;padding:16px 20px 10px}.back{width:42px;height:42px;border:0;border-radius:50%;background:var(--soft);color:var(--d);font-size:23px;cursor:pointer}.back[hidden]{visibility:hidden}.brand{text-align:center;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--d)}.phase{text-align:right;font-size:11px;color:var(--muted)}.progress{height:4px;background:#e8efe5;margin:0 20px}.progress i{display:block;height:100%;width:0;background:var(--l);transition:width .25s ease}.view{padding:24px 22px 28px;display:flex;flex:1;flex-direction:column}.kicker{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--d);margin-bottom:12px}h1,h2,h3{margin:0;color:var(--d);letter-spacing:-.035em;line-height:1.02}h1{font-size:clamp(38px,9vw,54px)}h2{font-size:clamp(29px,7vw,39px)}h3{font-size:20px}.accent{color:var(--l)}p{line-height:1.5;color:#31452E;margin:14px 0}.lead{font-size:18px}.small{font-size:12px;line-height:1.45;color:var(--muted)}.micro{font-size:11px;line-height:1.4;color:var(--muted)}.hero{margin:18px 0 8px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#fff,var(--soft));padding:10px;overflow:hidden}.hero svg{display:block;width:100%;height:auto}.options{display:grid;gap:9px;margin-top:18px}.option{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px;text-align:left;color:var(--text);font:inherit;cursor:pointer}.option b{display:block;color:var(--d);margin-bottom:3px}.option span{display:block;font-size:12px;color:var(--muted);line-height:1.35}.option.selected{border-color:var(--d);background:var(--soft);box-shadow:inset 4px 0 var(--l)}.continue-pill{display:none;margin-top:14px;border:0;border-radius:999px;background:var(--d);color:#fff;padding:14px 17px;font:700 15px Arimo,Arial,sans-serif;cursor:pointer;text-align:left}.continue-pill.show{display:block}.actions{margin-top:auto;padding-top:22px}.btn{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--d);color:#fff;font:700 16px Arimo,Arial,sans-serif;padding:11px 18px;cursor:pointer}.btn.secondary{background:#fff;color:var(--d);border:1px solid var(--line);margin-top:8px}.btn:disabled{opacity:.5;cursor:not-allowed}.field{width:100%;border:1px solid #bfd1b7;border-radius:16px;padding:14px 15px;font:16px Arimo,Arial,sans-serif;color:var(--text);background:#fff;margin:5px 0}.field:focus{outline:2px solid #8dc63f55;border-color:var(--d)}.big-input{font-size:32px;font-weight:700;color:var(--d);padding:18px}.unit-wrap{position:relative}.unit-wrap em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:700}.card{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:15px;margin:11px 0}.white-card{background:#fff}.dark-card{background:var(--d);color:#fff;border:0}.dark-card p,.dark-card .small{color:#dbead6}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row span{font-size:12px;color:var(--muted)}.row b{text-align:right;color:var(--d)}.dark-card .row{border-color:#ffffff2e}.dark-card .row span{color:#dbead6}.dark-card .row b{color:#fff}.metric-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.metric-main{font-size:clamp(42px,11vw,66px);font-weight:700;line-height:1;color:var(--l);margin:6px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric-mini{border:1px solid var(--line);border-radius:18px;padding:14px}.metric-mini b{display:block;font-size:30px;color:var(--d)}.score{font-size:clamp(68px,18vw,100px);font-weight:700;color:var(--l);line-height:.95}.score small{font-size:20px;color:var(--d)}.upload{display:block;border:2px dashed #b9cdb1;border-radius:20px;padding:30px 18px;text-align:center;background:var(--soft);cursor:pointer}.upload input{display:none}.status{margin-top:10px;font-size:12px;color:var(--muted)}.status.error{color:var(--err)}.trust{display:grid;gap:8px;margin-top:15px}.trust div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:#31452e}.locked{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lock-card{border:1px solid var(--line);border-radius:16px;padding:13px}.lock-card small{display:block;color:var(--muted)}.lock-card b{color:var(--d)}input[type=range]{width:100%;accent-color:var(--d)}.confidence{font-size:64px;font-weight:700;color:var(--l);line-height:1}.delta{font-size:30px;font-weight:700;color:var(--d)}.component{border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0}.component header{display:flex;justify-content:space-between;gap:12px;font-weight:700;color:var(--d)}.component p{font-size:13px;margin:8px 0 0}.tag{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:10px;font-weight:700;color:var(--d)}.check{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.4;margin:12px 0}.check input{margin-top:3px}.suggestions{display:grid;gap:7px;margin-top:7px}.suggestion{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left;font:inherit;cursor:pointer}.suggestion b,.suggestion span{display:block}.suggestion span{font-size:11px;color:var(--muted);margin-top:3px}.notice{border-left:4px solid var(--l);background:var(--soft);padding:12px 14px;border-radius:0 14px 14px 0;margin:12px 0}.divider{height:1px;background:var(--line);margin:14px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}.debug{font-family:ui-monospace,monospace;white-space:pre-wrap;font-size:10px}.legal-link{color:var(--d);font-weight:700}@media(max-width:520px){.app{padding:0}.shell{min-height:100svh;border-radius:0}.view{padding:22px 18px 24px}.top{padding-left:16px;padding-right:16px}.progress{margin:0 16px}.metrics,.two,.locked{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<div class="app"><main class="shell"><header class="top"><button id="back" class="back" aria-label="Torna indietro" hidden>←</button><div class="brand">ECON · SISTEMA ENERGIA | FOTOVOLTAICO</div><div id="phase" class="phase"></div></header><div class="progress"><i id="progress"></i></div><section id="view" class="view" aria-live="polite"></section></main></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={step:0,history:[],session:crypto.randomUUID(),a:{},bill:null,billConfirmed:false,score:0,scoreAfter:0,cfg:null,addressGeo:null};
const single={
1:{key:'fv_attitude',k:'PRIMA DELLA SFIDA',h:'Sul <span class="accent">fotovoltaico</span>, da che parte stai?',p:'Non c’è una risposta giusta. Segna la tua posizione: alla fine vedremo se i dati la rafforzano o la mettono in discussione.',o:[['Molto favorevole','Credo sia una scelta intelligente. Voglio capire come farla bene.'],['Favorevole, ma solo se i numeri tornano','L’idea mi convince. Il progetto deve convincermi altrettanto.'],['Interessato, ma non ancora convinto','Voglio capire prima di prendere posizione.'],['Scettico','Voglio che siano i dati a convincermi.'],['Molto scettico','Finché non vedo un caso solido, non mi basta quello che si racconta sul fotovoltaico.']]},
2:{key:'property_type',k:'SFIDA 1/5 · CASA',h:'Dove potrebbe nascere il tuo <span class="accent">fotovoltaico</span>?',p:'Partiamo dall’immobile. Il tipo di edificio cambia il percorso di verifica.',o:[['Casa indipendente','Partiamo dal tuo tetto.'],['Villetta / bifamiliare','Ora capiamo chi può decidere sul tetto.'],['Condominio','Qui conta anche il percorso decisionale.'],['Altro','Lo definiamo un passo alla volta.'],['Non lo so ancora','Nessun problema. Continuiamo con ciò che sai.']]},
3:{key:'roof_decision_authority',k:'SFIDA 1/5 · CASA',h:'Quanto controllo hai sulla decisione del tetto?',p:'',o:[['Posso decidere io','Hai già un elemento importante sotto controllo.'],['Decidiamo in più persone','Il progetto è possibile, ma la decisione è condivisa.'],['Dipende dal condominio','Qui il primo passo è anche decisionale.'],['Non lo so ancora','Prima incognita individuata.']]},
4:{key:'roof_type',k:'SFIDA 1/5 · CASA',h:'Che forma ha il tetto dove potrebbe nascere il tuo <span class="accent">fotovoltaico</span>?',p:'Non serve conoscere orientamento o misure. Per ora ci basta capire la configurazione.',o:[['Una o due falde principali','Configurazione chiara. L’esposizione verrà verificata più avanti.'],['Più falde','Più superfici, più variabili da leggere.'],['Tetto piano','Qui il layout diventa parte importante della verifica.'],['Non lo so','Nessun problema: il tetto resta tra i dati da verificare.']]},
6:{key:'usage_timing',k:'SFIDA 2/5 · ENERGIA',h:'Quando consumi <span class="accent">maggiormente</span>?',p:'Pensa a una giornata normale, senza controllare app o bollette.',o:[['Soprattutto di giorno','Buona coincidenza potenziale. Ora dobbiamo capire quanta parte del consumo avviene davvero mentre il fotovoltaico produce.'],['Soprattutto la sera','Qui nasce una domanda importante: quanta energia consumi quando il fotovoltaico non sta producendo? Questo può cambiare il ruolo dell’accumulo.'],['Giorno e sera','Profilo più distribuito. La quantità annuale da sola non basta ancora per capire come progettare il sistema.'],['Non lo so','Questo è uno dei dati più importanti da verificare.']]},
9:{key:'primary_goal',k:'SFIDA 4/5 · IL TUO OBIETTIVO',h:'Cosa vorresti ottenere davvero dal tuo <span class="accent">fotovoltaico</span>?',p:'Scegli il risultato che per te conta di più.',o:[['Prelevare meno energia dalla rete','Il punto sarà capire quanta energia puoi produrre e utilizzare direttamente.'],['Aumentare la mia autonomia energetica','Vuoi usare meglio ciò che produci. Questo renderà importante capire quando consumi davvero.'],['Essere più indipendente dalla rete','Vuoi ridurre il peso della rete. Non basta aggiungere una batteria: prima servono i dati giusti.'],['Preparare casa ai consumi futuri','Stai pensando al sistema prima ancora del singolo impianto.'],['Ricaricare l’auto con la mia energia','Energia e mobilità iniziano a diventare un unico sistema.'],['Capire se vale davvero la pena approfondire','Prima dei prodotti, vuoi capire il caso.']]},
10:{key:'main_uncertainty',k:'SFIDA 4/5 · IL TUO DUBBIO',h:'Cosa vuoi <span class="accent">chiarire</span> prima di decidere?',p:'Scegli il punto che oggi pesa di più sulla tua decisione.',o:[['Se economicamente ne vale la pena','Prima i numeri, poi la decisione.'],['Se il tetto è davvero adatto','Prima verifichiamo il contesto reale.'],['Se mi serve davvero una batteria','La batteria non si decide per abitudine.'],['Qual è la dimensione corretta dell’impianto','La taglia giusta nasce dai consumi e dall’immobile.'],['Come capire se un preventivo è sensato','Confrontare bene richiede criteri, non solo prezzi.'],['Altro','Lo teniamo come punto aperto.']]},
11:{key:'decision_identity',k:'PROFILO DECISIONALE · 1/3',h:'Che tipo di scelta vorresti che fosse, per te, il <span class="accent">fotovoltaico</span>?',p:'Scegli quella che ti rappresenta di più.',o:[['Essere un passo avanti','Aver fatto una scelta sensata prima che diventasse ovvia.'],['Aver deciso con criterio','Sapere che la decisione nasce dai numeri, non dalla moda.'],['Avere più controllo','Gestire meglio l’energia di casa e dipendere meno da decisioni esterne.'],['Aver valorizzato casa mia','Sentire di aver migliorato concretamente un bene importante.']]},
12:{key:'decision_style',k:'PROFILO DECISIONALE · 2/3',h:'Quando fai una scelta importante, cosa ti <span class="accent">distingue</span>?',p:'Scegli l’approccio che senti più tuo.',o:[['Voglio capire meglio degli altri','Prima di decidere, cerco di arrivare al punto che spesso viene trascurato.'],['Non mi basta una soluzione standard','Voglio capire se è davvero adatta al mio caso.'],['Decido solo quando i numeri mi convincono','Preferisco una scelta solida a una scelta veloce.'],['Mi fido molto del mio giudizio','Ascolto i pareri, ma alla fine voglio essere io a capire cosa ha senso.']]},
13:{key:'personal_reward',k:'PROFILO DECISIONALE · 3/3',h:'Quale risultato ti darebbe più <span class="accent">soddisfazione</span>?',p:'Non quello più tecnico. Quello che, personalmente, ti farebbe dire: “è stata una buona scelta”.',o:[['Aver colto il momento giusto','Sentire di aver fatto una scelta prima che diventasse scontata.'],['Sapere di aver scelto bene','Essere convinto che numeri e soluzione siano coerenti con il mio caso.'],['Sentirmi più libero nella gestione dell’energia','Avere più margine di scelta su come uso e produco energia.'],['Vedere casa mia più evoluta e valorizzata','Percepire un miglioramento concreto dell’immobile.']]},
14:{key:'initial_system_belief',k:'SFIDA 5/5 · LA TUA IDEA',h:'Se dovessi scegliere oggi, quale <span class="accent">fotovoltaico</span> immagineresti per casa tua?',p:'Non cercare la risposta giusta. Scegli la configurazione che oggi ti sembra più sensata.',o:[['Solo fotovoltaico','La tua scelta è registrata. Tra poco vedremo quanto è sostenuta dai dati.'],['Fotovoltaico + accumulo','La tua scelta è registrata. Tra poco vedremo quanto è sostenuta dai dati.'],['Fotovoltaico + accumulo con backup','Backup: possibilità di mantenere alimentati alcuni carichi anche in assenza di rete, se la configurazione tecnica lo consente.'],['Fotovoltaico + ricarica auto','La tua scelta è registrata. Tra poco vedremo quanto è sostenuta dai dati.'],['Fotovoltaico + accumulo + ricarica','La tua scelta è registrata. Tra poco vedremo quanto è sostenuta dai dati.'],['Non lo so ancora','La tua scelta è registrata. Tra poco vedremo quanto è sostenuta dai dati.']]},
25:{key:'decision_horizon',k:'ULTIMO DATO SUL TUO CASO',h:'Quando vorresti capire se vale la pena <span class="accent">procedere</span>?',p:'Non è un impegno. Ci serve solo per capire quanto è attuale la tua valutazione.',o:[['Entro 3 mesi','Orizzonte registrato.'],['Tra 3 e 6 mesi','Orizzonte registrato.'],['Tra 6 e 12 mesi','Orizzonte registrato.'],['Più avanti','Orizzonte registrato.'],['Sto solo esplorando','Orizzonte registrato.']]}
};
const currentOptions=[['climate','Climatizzazione'],['heatpump','Pompa di calore'],['ev','Auto elettrica / plug-in'],['induction','Piano a induzione'],['pool','Piscina'],['none','Nessuno di questi'],['unknown','Non lo so']];
const futureOptions=[['ev','Auto elettrica / plug-in'],['heatpump','Pompa di calore'],['climate','Più climatizzazione'],['other','Altri nuovi consumi importanti'],['none','Probabilmente nulla'],['unknown','Non lo so ancora']];
function track(event,detail={}){fetch('/api/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:state.session,event,step:state.step,detail}),keepalive:true}).catch(()=>{})}
function phaseFor(n){if(n<=16)return['INTUISCI','1/4'];if(n<=20)return['VERIFICA','2/4'];if(n<=23)return['CAPISCI','3/4'];return['DECIDI','4/4']}
function go(n,record=true){if(record&&n!==state.step)state.history.push(state.step);state.step=n;render();track('screen_view',{screen:n});window.scrollTo({top:0,behavior:'smooth'})}
function back(){if(!state.history.length)return;state.step=state.history.pop();render();window.scrollTo({top:0})}
$('#back').onclick=back;
function frame(k,h,p,b){return `<div class="kicker">${k}</div><h2>${h}</h2>${p?`<p>${p}</p>`:''}${b}`}
function singleScreen(n){const q=single[n],v=state.a[q.key];return frame(q.k,q.h,q.p,`<div class="options">${q.o.map((x,i)=>`<button class="option ${v===i?'selected':''}" data-i="${i}"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join('')}</div><button id="pill" class="continue-pill ${v!==undefined?'show':''}">${v!==undefined?esc(q.o[v][1]):''} → continua</button>`)}
function multiScreen(n){const isCurrent=n===7,key=isCurrent?'current_loads':'future_loads',opts=isCurrent?currentOptions:futureOptions,sel=state.a[key]||[];const h=isCurrent?'Quali consumi importanti hai già <span class="accent">elettrificato</span>?':'Nei prossimi 3 anni, cosa potrebbe cambiare nei tuoi <span class="accent">consumi</span>?';const p=isCurrent?'Seleziona tutto ciò che è già presente nella casa.':'Seleziona ciò che stai già considerando, anche se non hai ancora deciso.';return frame(isCurrent?'SFIDA 2/5 · ENERGIA':'SFIDA 3/5 · DOMANI',h,p,`<div class="options">${opts.map(x=>`<button class="option ${sel.includes(x[0])?'selected':''}" data-v="${x[0]}"><b>${x[1]}</b></button>`).join('')}</div><button id="pill" class="continue-pill ${sel.length?'show':''}">${isCurrent?'Profilo registrato. Continuiamo con ciò che può cambiare.':'Scenario futuro registrato. Continuiamo.'} → continua</button>`)}
function billVal(k){return state.bill?.fields?.[k]?.value??state.bill?.[k]??''}
function billSource(k){return state.bill?.fields?.[k]?.source||state.bill?.fields?.[k]?.source_type||''}
function score(){let n=0;if(state.a.property_type!==undefined&&state.a.property_type!==4)n+=5;if(state.a.roof_decision_authority!==undefined&&state.a.roof_decision_authority!==3)n+=5;if(state.a.roof_type!==undefined&&state.a.roof_type!==3)n+=5;if(state.a.address)n+=10;if(state.bill)n+=5;if(+billVal('annual_kwh'))n+=15;const m=+billVal('coverage_months')||0;if(m>=11)n+=10;else if(m>=6)n+=5;if(billVal('f1_kwh')||billVal('f2_kwh')||billVal('f3_kwh'))n+=5;if(state.a.usage_timing!==undefined&&state.a.usage_timing!==3)n+=6;if((state.a.current_loads||[]).length&&!state.a.current_loads.includes('unknown'))n+=6;if((state.a.future_loads||[]).length&&!state.a.future_loads.includes('unknown'))n+=8;if(state.a.primary_goal!==undefined)n+=8;if(state.a.main_uncertainty!==undefined)n+=6;if(state.a.decision_horizon!==undefined)n+=6;return Math.min(100,n)}
function economic(){const k=+billVal('annual_kwh')||0,sp=+billVal('annual_spend')||0;if(!k||!sp)return null;const c=state.cfg?.economics||{},yieldK=+c.pvYieldKwhPerKwp||1250,cost=+c.pvCostPerKwp||1350,minInv=+c.minPvInvestment||5000,exportV=+c.exportedEnergyValue||.06,avoid=+c.fallbackAvoidableShare||.74;let au=state.a.usage_timing===0?.56:state.a.usage_timing===1?.36:.46;const belief=state.a.initial_system_belief;if([1,2,4].includes(belief))au=Math.min(.72,au+.14);const kwp=Math.min(12,Math.max(3,k/yieldK*1.05)),prod=kwp*yieldK,self=Math.min(k,prod*au),avoidPrice=sp/k*avoid,benefit=self*avoidPrice+Math.max(0,prod-self)*exportV,inv=Math.max(minInv,kwp*cost);return{k,sp,kwp,prod,self,benefit,inv,yield:benefit/inv*100,payback:benefit>0?inv/benefit:null,au}}
function band(v){if(v<40)return'Ci sono ancora informazioni importanti da definire.';if(v<60)return'Hai già una prima base concreta.';if(v<75)return'Buona base. Il quadro è già leggibile.';if(v<85)return'Il tuo caso è già ben definito per approfondire.';return'Quadro molto definito.'}
function psychLine(){if(state.a.decision_style===2)return'Hai detto che per decidere vuoi i numeri. Ora ne hai abbastanza per sapere cosa approfondire, non ancora per saltare direttamente a una conclusione.';if(state.a.decision_style===1)return'Il risultato conferma una cosa: il tuo caso merita di essere letto come caso specifico, non come configurazione standard.';if((state.a.fv_attitude??0)>=3)return'Sei partito scettico. Il test non ti chiede di cambiare idea: ti mostra quali elementi concreti vale la pena verificare.';return'Sei partito favorevole. I dati danno basi alla tua idea, ma mostrano anche dove serve ancora verifica.'}
function blindspot(){if(!state.bill)return['I CONSUMI REALI','Senza una bolletta leggibile manca ancora la baseline energetica da cui partire.'];if(state.a.roof_decision_authority===3)return['CHI PUÒ DECIDERE SUL TETTO','Prima della tecnologia va chiarito il percorso decisionale sull’immobile.'];if([1,2].includes(state.a.primary_goal)||[1,2,4].includes(state.a.initial_system_belief))return['QUANDO CONSUMI DAVVERO','Il consumo annuale ci dice quanto usi, ma non ancora quando lo usi. Senza questo dato non possiamo capire seriamente il ruolo della batteria.'];if((state.a.future_loads||[]).includes('unknown'))return['LA CASA CHE AVRAI TRA 3 ANNI','I consumi futuri sono ancora aperti e possono cambiare il progetto.'];if(state.a.roof_type===3)return['IL TETTO','La configurazione del tetto è ancora da verificare prima di approfondire il progetto.'];return['L’IMMOBILE REALE','Conosciamo meglio i consumi. Il prossimo passo è collegare il test all’immobile corretto.']}

v.innerHTML=h;bind();}
function bind(){const n=state.step;if(n===0)$('#start').onclick=()=>go(1);if(single[n]){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.a[single[n].key]=+b.dataset.i;render()});$('#pill')?.addEventListener('click',()=>go(n+1))}if(n===5){$('#predOk').onclick=()=>{const x=+$('#pred').value;if(!x)return;state.a.annual_kwh_prediction=x;go(6)};$('#predNo').onclick=()=>{state.a.annual_kwh_prediction=null;go(6)}}if(n===7||n===8){const key=n===7?'current_loads':'future_loads';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{let arr=[...(state.a[key]||[])],v=b.dataset.v;if(v==='none'||v==='unknown')arr=arr.includes(v)?[]:[v];else{arr=arr.filter(x=>x!=='none'&&x!=='unknown');arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]}state.a[key]=arr;render()});$('#pill')?.addEventListener('click',()=>go(n+1))}if(n===15){const update=()=>{const c=+$('#conf').value;state.a.confidence_before_data=c;$('#confNum').textContent=c+'%';$('#confText').textContent=c<=30?'Hai scelto, ma lasci molta porta aperta ai dati.':c<=60?'Hai un’idea, ma non la consideri ancora definitiva.':c<=80?'La tua convinzione è già piuttosto forte.':'Sei molto convinto della configurazione che hai scelto.'};$('#conf').oninput=update;$('#confLock').onclick=()=>{update();go(16)}}if(n===16)$('#challenge').onclick=()=>go(17);if(n===17)$('#billFile').onchange=e=>e.target.files?.[0]&&uploadBill(e.target.files[0]);if(n===18){if(!state.billConfirmed)$('#billConfirm').onclick=()=>{const ck=+$('#cKwh').value,cs=+$('#cSpend').value,cm=+$('#cMonths').value;if(ck)state.bill.fields.annual_kwh={value:ck,source:'DATO CONFERMATO DALL’UTENTE'};if(cs)state.bill.fields.annual_spend={value:cs,source:'DATO CONFERMATO DALL’UTENTE'};if(cm)state.bill.fields.coverage_months={value:cm,source:'DATO CONFERMATO DALL’UTENTE'};state.billConfirmed=true;track('bill_data_confirmed');render()};else $('#diagNext').onclick=()=>go(19)}if(n===19)$('#gapNext').onclick=()=>go(20);if(n===20){const update=()=>{const x=+$('#afterConf').value,b=state.a.confidence_before_data??60;state.a.confidence_after_first_data=x;$('#afterNum').textContent=x+'%';$('#afterRow').textContent=x+'%';$('#delta').textContent=(x-b>=0?'+':'')+(x-b)+' punti'};$('#afterConf').oninput=update;$('#afterLock').onclick=()=>{update();go(21)}}if(n===21)$('#scoreNext').onclick=()=>go(22);if(n===22)$('#componentsNext').onclick=()=>go(23);if(n===23)$('#blindNext').onclick=()=>go(24);if(n===24){if($('#useSupply'))$('#useSupply').onclick=()=>{const s=billVal('supply_address');$('#addressSearch').value=s||'';const m=(s||'').match(/^(.*?)[, ]+(\d+[A-Za-z]?)\s*,?\s*(\d{5})?\s*(.*)$/);if(m){$('#street').value=m[1]||'';$('#civic').value=m[2]||'';$('#postal').value=m[3]||'';$('#city').value=m[4]||''}};let timer;if($('#addressSearch')&&state.cfg?.address_autocomplete)$('#addressSearch').oninput=()=>{clearTimeout(timer);const q=$('#addressSearch').value.trim();if(q.length<5)return $('#suggestions').classList.add('hidden');timer=setTimeout(()=>addressSearch(q),400)};$('#addressOk').onclick=()=>{const street=$('#street').value.trim(),civic=$('#civic').value.trim(),postal=$('#postal').value.trim(),city=$('#city').value.trim();if(street.length<3||!civic||postal.length<5||city.length<2)return alert('Completa via/piazza, numero civico, CAP e comune.');state.a.address=`${street} ${civic}, ${postal} ${city}`;track('address_confirmed');go(25)}}if(n===26)$('#rewardNext').onclick=()=>go(27);if(n===27){track('lead_form_opened');$('#leadSave').onclick=saveLead}if(n===28)$('#summaryNext').onclick=()=>go(29)}
async function uploadBill(file){
  const st=$('#uploadStatus');
  st.className='status';
  st.textContent='Preparazione lettura locale…';
  track('bill_upload_started',{processing:'browser-local'});
  try{
    const {parseBillFile}=await import('/assets/bill-parser.js');
    const j=await parseBillFile(file,{onProgress:(p)=>{
      if(!st)return;
      if(p.stage==='pdf') st.textContent='Lettura del PDF nel browser…';
      else if(p.stage==='ocr-start') st.textContent='Documento scansionato: avvio OCR locale…';
      else if(p.stage==='ocr-page') st.textContent='OCR locale · pagina '+p.page+' di '+p.pages+'…';
      else if(p.stage==='ocr') st.textContent='OCR locale · pagina '+(p.page||1)+'/'+(p.pages||1)+' · '+p.progress+'%';
      else if(p.stage==='done') st.textContent='Lettura completata.';
    }});
    if(!j.fields)j.fields={};
    state.bill=j;
    state.billConfirmed=false;
    track('bill_parse_success',{supplier:j.supplier||null,parser_mode:j.parser_mode||null,processing:'browser-local'});
    go(18);
  }catch(e){
    st.className='status error';
    st.textContent='Lettura non riuscita: '+e.message;
    track('bill_parse_failed',{reason:String(e.message).slice(0,120),processing:'browser-local'});
  }
}
async function addressSearch(q){const box=$('#suggestions');try{const r=await fetch('/api/address/suggest?q='+encodeURIComponent(q)),j=await r.json();if(!r.ok)throw Error();box.innerHTML=(j.results||[]).map((x,i)=>`<button class="suggestion" data-i="${i}"><b>${esc((x.street||x.display_name||'')+' '+(x.civic||''))}</b><span>${esc([x.postal,x.city,x.province].filter(Boolean).join(' · '))}</span></button>`).join('');box.classList.toggle('hidden',!(j.results||[]).length);document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{const x=j.results[+b.dataset.i];$('#addressSearch').value=x.display_name||'';$('#street').value=x.street||'';$('#civic').value=x.civic||'';$('#postal').value=x.postal||'';$('#city').value=x.city||'';state.addressGeo={lat:x.lat,lon:x.lon,provider:x.provider};box.classList.add('hidden');track('address_selected',{provider:x.provider||null})})}catch{box.classList.add('hidden')}}
async function saveLead(){const status=$('#leadStatus'),first=$('#first').value.trim(),last=$('#last').value.trim(),mobile=$('#mobile').value.trim(),email=$('#email').value.trim(),privacy=$('#privacy').checked,commercial=$('#commercial').checked;if(!first||!last||!mobile||!email||!privacy){status.className='status error';status.textContent='Completa i dati e conferma la presa visione privacy.';return}const payload={schema:'econ.lead.v1',session_id:state.session,contact:{first_name:first,last_name:last,mobile,email,commercial_fv_request:commercial},property:{address:state.a.address,geo:state.addressGeo},privacy:{acknowledged:true,version:state.cfg?.privacy_version||'v1.8'},test:{score:state.scoreAfter||score(),answers:state.a},bill_summary:{supplier:state.bill?.supplier||null,parser_mode:state.bill?.parser_mode||null,annual_kwh:billVal('annual_kwh'),annual_spend:billVal('annual_spend'),coverage_months:billVal('coverage_months'),period_kwh:billVal('period_kwh'),bill_amount:billVal('bill_amount'),power_kw:billVal('power_kw'),f1_kwh:billVal('f1_kwh'),f2_kwh:billVal('f2_kwh'),f3_kwh:billVal('f3_kwh'),supply_address:billVal('supply_address')}};status.className='status';status.textContent='Salvataggio…';try{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.detail||'lead_failed');state.a.commercial_request=commercial;state.a.lead_id=j.lead_id||null;track('lead_completed',{commercial_fv_request:commercial,adapter:j.adapter||null,persisted:Boolean(j.persisted)});go(28)}catch(e){status.className='status error';status.textContent='Non siamo riusciti a salvare il risultato. Riprova.';track('lead_save_failed',{reason:String(e.message).slice(0,80)})}}
fetch('/api/config').then(r=>r.ok?r.json():null).then(c=>state.cfg=c).catch(()=>{});render();track('screen_view',{screen:0});
</script>
